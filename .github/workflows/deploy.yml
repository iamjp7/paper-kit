# Deploy PaperKit to GitHub Pages.
#
# After first push:
#   1. Repo → Settings → Pages → Source: GitHub Actions
#   2. (Optional) Settings → Pages → Custom domain → your-domain.com
#   3. DNS: CNAME www → <username>.github.io  (or A records for apex — see GitHub docs)
#
# For username.github.io/paper-kit (no custom domain), add repo variable:
#   Settings → Secrets and variables → Actions → Variables → VITE_BASE_PATH = /paper-kit/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # /paper-kit/ for github.io project site; override with repo variable for custom domain
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/paper-kit/' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
